name: track_expenses
description: "Flutter Material Design 组件展示及系统能力 Demo 应用"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # 触觉反馈/振动
  vibration: ^2.0.1

  # 数据存储
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # 文件操作
  file_picker: ^8.1.7

  # 分享
  share_plus: ^10.1.4

  # URL启动器
  url_launcher: ^6.3.1

  # 相机
  camera: ^0.11.1

  # 生物识别
  local_auth: ^2.3.0

  # 传感器
  sensors_plus: ^6.1.1

  # 权限管理
  permission_handler: ^11.3.1

  # 设备信息
  device_info_plus: ^11.2.1

  # 图片选择
  image_picker: ^1.1.2

  # 动画
  animations: ^2.0.11
  lottie: ^3.2.1
  confetti: ^0.7.0

  # 图表
  fl_chart: ^0.70.1

  # 日历与时间
  table_calendar: ^3.1.2

  # 二维码
  qr_flutter: ^4.1.0

  # 通知
  flutter_local_notifications: ^18.0.1
  
  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # 引导介绍
  tutorial_coach_mark: ^1.2.11

  # 进度指示器
  percent_indicator: ^4.2.3
  step_progress_indicator: ^1.0.2



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # 集成测试
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
